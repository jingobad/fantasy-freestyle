if(tab==='results'){let last=s.last[0];c.innerHTML=`<div class="toolbar"><h2>Ergebnisse & Verlauf</h2></div>${last?`<div class="panel"><div class="eyebrow">Zuletzt ausgewertet</div><h3>${esc(last.category)} · ${phaseName[last.phase]}</h3><div class="small">${esc(last.date)} · ${esc(last.time)} Uhr</div>${last.lines.length?last.lines.map(a=>`<div class="result"><b>${esc(a.name)}</b> · Platz ${a.rank}<div class="small">+${money(a.points)} Punkte · +${money(a.bonus)} Credits</div></div>`).join(''):'<p class="small">Kein Athlet aus deinem Team war in dieser Runde.</p>'}</div>`:''}<div class="panel" style="margin-top:12px"><h3>Transaktionen</h3><div class="timeline">${s.history.length?s.history.slice(0,100).map(x=>`<div class="event"><div><b>${esc(x.type)}</b> · ${esc(x.name)}</div><div class="right">${x.points?'+'+money(x.points)+' Pkt · ':''}${x.credits>0?'+':''}${money(x.credits)} Cr</div></div>`).join(''):'<div class="small">Noch keine Transaktionen.</div>'}</div></div>`}
if(tab==='rules'){c.innerHTML=`<div class="panel"><h2>Spielregeln dieser Testversion</h2><p>Du startest mit <b>200 Credits</b> und darfst beliebig viele Athletenstarts kaufen, solange dein Budget reicht. Ein Start in zwei Disziplinen zählt als zwei handelbare Einträge.</p><p>Preise basieren auf den historischen Ergebnissen aus Millau. Unbekannte Athleten kosten zunächst 12 Credits. Nach jeder Runde ändern sich Marktwerte je nach Platzierung und Qualifikation.</p><p>Eigene Athleten sammeln Platzierungspunkte und ggf. 40 Zusatzpunkte fürs Weiterkommen. Credit-Prämien fließen direkt auf dein Konto. Bereits gewonnene Punkte bleiben nach einem Verkauf bestehen.</p><p>Manueller Verkauf: <b>70 %</b> des aktuellen Marktwerts. Ausgeschiedene Athleten werden beim nächsten Klick auf „Runde auswerten“ automatisch für <b>50 %</b> verkauft.</p><p class="note">Wichtig: Diese Demo nutzt bereits bekannte historische Ergebnisse. Qualifikation und Teilnahme der nächsten Runde werden aus den importierten Daten rekonstruiert. Für einen fairen Live-Betrieb brauchen wir echte Startlisten, zeitgesteuerte Transferfenster und serverseitige Spielregeln. Die Preis- und Punkteformeln sind noch Testwerte.</p></div>`}
document.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>buy(b.dataset.buy));document.querySelectorAll('[data-sell]').forEach(b=>b.onclick=()=>{sell(b.dataset.sell);save();render();toast('Athlet verkauft!')})}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});document.getElementById('advance').onclick=advance;document.getElementById('reset').onclick=()=>{if(confirm('Spielstand wirklich zurücksetzen?')){s=initial();query='';category='Alle';tab='market';save();render()}};render();
</script></body></html>
